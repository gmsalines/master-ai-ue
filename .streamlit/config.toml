[server]
# el padrón mensual puede pesar varios cientos de MB
maxUploadSize = 1024

[client]
# sin el menú de desarrollo ni el botón «Deploy»
toolbarMode = "minimal"

[theme]
# sobrio, de aplicación de trabajo: fondo gris muy claro, superficies blancas, verde profundo y acento turquesa
base = "light"
primaryColor = "#0D2927"
backgroundColor = "#F7F8F7"
secondaryBackgroundColor = "#EEF2F0"
textColor = "#17211F"
borderColor = "#E3E7E5"
redColor = "#B5473A"
greenColor = "#2E7D5B"
blueColor = "#2F6F8F"
orangeColor = "#B7791F"
yellowColor = "#B7791F"
linkColor = "#1F7F73"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap, sans-serif"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap, sans-serif"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap, monospace"
headingFontWeights = [650, 600, 600, 600, 600, 600]
baseFontSize = 15
baseRadius = "small"
buttonRadius = "small"
dataframeHeaderBackgroundColor = "#F2F4F3"
showSidebarBorder = true
chartCategoricalColors = ["#2E7D5B", "#B5473A", "#9AA5A1", "#2FAF9F", "#B7791F"]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F4F3"
